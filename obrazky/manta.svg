<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128" width="128" height="128">
  <!-- Kruhové pozadí (identický styl, dvojnásobný rozměr) -->
  <circle cx="64" cy="64" r="60" fill="#F4F5F7" stroke="#0D2C54" stroke-width="4" />
  
  <!-- Jemná projektová mřížka na pozadí (přesně škálovaná na 128x128) -->
  <path d="M32 48 H96 M32 64 H96 M32 80 H96 M48 32 V96 M64 32 V96 M80 32 V96" stroke="#7FB8EE" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />
  
  <!-- LOGO: MANTA OBROVSKÁ -->
  <g id="manta-ray">
    <!-- Dlouhý bičovitý ocas -->
    <path d="M64 74 L64 108" stroke="#0D2C54" stroke-width="3" stroke-linecap="round" />
    
    <!-- Spodní bílé břišní lemování / Kontura pro plasticitu -->
    <path d="M64 30 C54 30 32 44 20 54 C34 56 50 64 64 76 C78 64 94 56 108 54 C96 44 74 30 64 30 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" />
    
    <!-- Hlavní tmavě modré tělo a křídla -->
    <path d="M64 33 
             C56 33 35 45 22 53 
             C35 54 50 61 64 73 
             C78 61 93 54 106 53 
             C93 45 72 33 64 33 Z" fill="#0D2C54" />
             
    <!-- Hlavové ploutve / "Rohy" typické pro mantu -->
    <path d="M58 33 C56 26 59 23 60 23 C61 23 62 27 61 33 Z" fill="#0D2C54" stroke="#0D2C54" stroke-width="1" />
    <path d="M70 33 C72 26 69 23 68 23 C67 23 66 27 67 33 Z" fill="#0D2C54" stroke="#0D2C54" stroke-width="1" />
    
    <!-- Světle modrý elegantní hřbetní vzor / Inženýrský odlesk -->
    <path d="M64 40 C58 40 46 48 38 52 C46 52 56 56 64 63 C72 56 82 52 90 52 C82 48 70 40 64 40 Z" fill="#7FB8EE" opacity="0.8" />
  </g>
</svg>
